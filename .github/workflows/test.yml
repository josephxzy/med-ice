name: Smoke test

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-linux:
    name: Rime smoke test
    runs-on: ubuntu-24.04
    if: github.repository == 'josephxzy/med-ice'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install lint dependencies
        run: |
          python3 -m pip install yamllint
          sudo apt install -y luarocks
          sudo luarocks install luacheck

      - name: Run lint
        run: make -C tool/build lint

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: tool/build/go.sum

      - name: Build
        run: make -C tool/build build

      - name: Install rime CLI tools
        run: sudo apt-get install -y librime-bin

      - name: Run smoke test suite
        run: make -C tool/build smoke
