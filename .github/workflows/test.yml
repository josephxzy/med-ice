name: Smoke test

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-linux:
    name: Rime smoke test
    runs-on: ubuntu-24.04
    if: github.repository == 'josephxzy/med-ice'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install lint dependencies
        run: |
          python3 -m pip install yamllint
          sudo apt install -y luarocks
          sudo luarocks install luacheck

      - name: Run lint
        run: make -C tool/build lint

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: tool/build/go.sum

      - name: Build
        run: make -C tool/build build

      - name: Cache rime CLI build
        id: cache-rime
        uses: actions/cache@v5
        with:
          path: /opt/rime-cli
          key: rime-cli-v5-${{ runner.os }}-${{ runner.arch }}

      - name: Build rime CLI tools
        if: steps.cache-rime.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libboost-dev libboost-filesystem-dev \
            libboost-regex-dev libleveldb-dev libmarisa-dev libopencc-dev \
            libyaml-cpp-dev libgoogle-glog-dev liblua5.4-dev
          git clone --depth 1 https://github.com/rime/librime.git /tmp/librime-src
          git clone --depth 1 https://github.com/rime/librime-lua.git /tmp/librime-src/plugins/lua
          python3 tool/build/smoke/patch_api_console.py /tmp/librime-src/tools/rime_api_console.cc
          cmake -B /tmp/librime-src/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TEST=OFF \
            -DCMAKE_INSTALL_PREFIX=/opt/rime-cli \
            /tmp/librime-src
          cmake --build /tmp/librime-src/build -j$(nproc)
          sudo cmake --install /tmp/librime-src/build
          sudo cp /tmp/librime-src/build/bin/rime_api_console /opt/rime-cli/bin/

      - name: Configure rime CLI environment
        run: |
          echo "/opt/rime-cli/bin" >> $GITHUB_PATH
          echo "LD_LIBRARY_PATH=/opt/rime-cli/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> $GITHUB_ENV

      - name: Run smoke test suite
        run: make -C tool/build smoke
