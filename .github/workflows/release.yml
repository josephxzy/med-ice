name: Test and Release

on:
  push:
    branches:
      - main
    tags:
      - "[0-9]+.*"
    paths:
      - "**/**"
      - "!**.md"
      - "!**.gitignore"
  workflow_dispatch:

jobs:
  release:
    name: Test and Release
    runs-on: ubuntu-24.04
    if: github.repository == 'josephxzy/med-ice'

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Lint
      - name: Install lint dependencies
        run: |
          echo "Install lint dependencies..."
          python3 -m pip install yamllint
          sudo apt install -y luarocks
          sudo luarocks install luacheck

      - name: Run lint
        run: make -C tool/build lint

      # Build (required: generates build/out/ with sorted/deduped dicts, emoji, cn_en, etc.)
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: tool/build/go.sum

      - name: Build
        id: build
        run: make -C tool/build build

      # Smoke
      - name: Cache rime CLI build
        id: cache-rime
        uses: actions/cache@v5
        with:
          path: /opt/rime-cli
          key: rime-cli-v5-${{ runner.os }}-${{ runner.arch }}

      - name: Build rime CLI tools
        if: steps.cache-rime.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libboost-dev libboost-filesystem-dev \
            libboost-regex-dev libleveldb-dev libmarisa-dev libopencc-dev \
            libyaml-cpp-dev libgoogle-glog-dev liblua5.4-dev
          git clone --depth 1 https://github.com/rime/librime.git /tmp/librime-src
          curl -fsSL https://github.com/rime/librime-lua/archive/refs/heads/main.tar.gz | \
            tar xz -C /tmp/librime-src/plugins/
          mv /tmp/librime-src/plugins/librime-lua-main /tmp/librime-src/plugins/lua
          python3 tool/build/smoke/patch_api_console.py /tmp/librime-src/tools/rime_api_console.cc
          cmake -B /tmp/librime-src/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TEST=OFF \
            -DCMAKE_INSTALL_PREFIX=/opt/rime-cli \
            /tmp/librime-src
          cmake --build /tmp/librime-src/build -j$(nproc)
          sudo cmake --install /tmp/librime-src/build
          sudo cp /tmp/librime-src/build/bin/rime_api_console /opt/rime-cli/bin/

      - name: Configure rime CLI environment
        run: |
          echo "/opt/rime-cli/bin" >> $GITHUB_PATH
          echo "LD_LIBRARY_PATH=/opt/rime-cli/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> $GITHUB_ENV

      - name: Run smoke test suite
        run: make -C tool/build smoke

      - name: Clean smoke artifacts
        run: |
          rm -f tool/build/out/installation.yaml tool/build/out/user.yaml
          rm -rf tool/build/out/*.userdb tool/build/out/sync/

      # Pack
      - name: Pack dicts
        run: |
          rm -rf dist
          mkdir dist
          cd tool/build/out
          echo "Pack all ..."
          find . -maxdepth 1 -name "*.lua" -o -name "*.yaml" -o -name "*.txt" | zip ../../../dist/full.zip -@
          zip -r ../../../dist/full.zip cn_dicts en_dicts lua opencc med LICENSE
          echo "Pack dicts ..."
          zip -r ../../../dist/all_dicts.zip cn_dicts en_dicts opencc radical_pinyin.dict.yaml
          echo "Pack cn_dicts ..."
          zip -r ../../../dist/cn_dicts.zip cn_dicts
          echo "Pack en_dicts ..."
          zip -r ../../../dist/en_dicts.zip en_dicts
          echo "Pack opencc ..."
          zip -r ../../../dist/opencc.zip opencc
          echo "Pack binary for fcitx5.js ..."
          zip -r ../../../dist/fcitx5_rime_js-med_ice.zip build lua opencc custom_phrase.txt

      # Deploy built output to repo root (for plum compatibility and direct clone usage)
      - name: Deploy built files to root
        if: ${{ github.ref == 'refs/heads/main' }}
        run: |
          echo "Deploying built files from tool/build/out/ to repo root..."
          cp -r tool/build/out/* .
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add --all
          if ! git diff --cached --quiet; then
            COMMIT_MSG=$(git log -1 --pretty=%B | sed -e 's/\s\[build\]$//' -e 's/^[a-zA-Z()]*:\s*//')
            git commit -m "build(ci): auto build for -> ${COMMIT_MSG} <-"
            git pull --rebase
            git push
          else
            echo "No changes to commit."
          fi

      - name: Create nightly release
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: softprops/action-gh-release@v3
        with:
          body: |
            ## 说明

            这里是每次提交后自动打包的版本，包含最新的功能和词库

            - `full.zip` : 包含所有词典和方案文件
            - `cn_dicts.zip`：中文词库
            - `en_dicts.zip`：英文词库
            - `opencc.zip`：opencc 词库（emoji 等）
            - `all_dicts.zip`：以上三个词库的整合
            - `fcitx5_rime_js-med_ice.zip`：适用于 fcitx5-rime.js 的预构建包

          tag_name: nightly
          preserve_order: true
          name: "nightly build"
          make_latest: true
          files: |
            dist/full.zip
            dist/all_dicts.zip
            dist/cn_dicts.zip
            dist/en_dicts.zip
            dist/opencc.zip
            dist/fcitx5_rime_js-med_ice.zip

      - name: Create stable release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          body: |
            ## 重要更新

            **release notes**

            ## 说明

            - `full.zip` : 包含所有词典和方案文件
            - `cn_dicts.zip`：中文词库
            - `en_dicts.zip`：英文词库
            - `opencc.zip`：opencc 词库（emoji 等）
            - `all_dicts.zip`：以上三个词库的整合
            - `fcitx5_rime_js-med_ice.zip`：适用于 fcitx5-rime.js 的预构建包

          draft: true
          preserve_order: true
          make_latest: true
          files: |
            dist/full.zip
            dist/all_dicts.zip
            dist/cn_dicts.zip
            dist/en_dicts.zip
            dist/opencc.zip
            dist/fcitx5_rime_js-med_ice.zip
